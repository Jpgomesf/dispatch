# Copy to ~/.config/claude-harness/config.toml and replace every placeholder.
outreach_file = "~/.config/claude-harness/outreach.md"   # optional, default shown
# state_dir = "~/.local/state/claude-harness"            # optional, default shown

[heartbeat]
interval = "10m"          # parsed duration: s/m/h
model = "sonnet"
effort = "medium"
max_budget_usd = 1.0      # per tick
max_cards_per_tick = 1    # new cards queued per triage

[card]
model = "claude-opus-5-5"
effort = "high"
max_budget_usd = 20.0     # per card
max_parallel = 2          # card sessions at once; each card gets its own git worktree

[sources]                 # what the heartbeat watches; free-form strings the skill interprets
slack_channels = ["C0000000000"]
tracker = "linear"        # linear | jira | other
tracker_query = "assignee:me state:Todo label:agent"

[[workspaces]]            # where card work happens; the workflow skill picks by match
name = "example-app"
path = "~/code/example-app"
match = ["EX-", "example-app"]

# Who may be messaged is not configured here: use Claude Code permission rules
# (e.g. deny "mcp__*__send_message") and your outreach.md. See docs/machine-setup.md.
