# Copy to ~/.config/dispatch/config.toml and replace every placeholder.
# One runner (one config, one service) per project; every runner needs its own `name`.
name = "example-app"          # required; unique per machine; used in claims, branches, labels
# plugin_dir = "~/rust-projects/dispatch/plugin"   # optional starter pack; defaults to the repo's plugin/ when present
outreach_file = "~/.config/dispatch/outreach.md"   # optional, default shown
# state_dir = "~/.local/state/dispatch"            # optional, default shown

[triage]                      # started by intake events and by this timer
interval = "30m"              # fallback sweep when no events arrive; parsed duration: s/m/h
model = "sonnet"
effort = "medium"
max_budget_usd = 1.0          # per triage session
max_cards_per_tick = 1        # new cards queued per triage
timeout = "20m"               # wall-clock cap per triage session
# objective = "Check the new activity below (or sweep your sources if `events` is empty) and decide what deserves attention: respond, draft, ignore, pick up assigned work as cards, or investigate mentions."

[card]                        # model, effort and budget also apply to discussion sessions
model = "claude-opus-5-5"
effort = "high"
max_budget_usd = 20.0         # per session (one card attempt or one discussion)
max_parallel = 2              # card + discussion sessions at once; each gets its own git worktree
timeout = "3h"                # wall-clock cap per card attempt
max_attempts = 3              # attempts per card; then it is escalated to you through triage
# objective = "Work card {ref} to completion in this workspace."

[discussion]                  # model, effort and budget come from [card]
timeout = "1h"                # wall-clock cap per discussion session
# objective = "You were mentioned in a discussion about {ref}. Investigate the question and respond in the thread."

[sessions]                    # every session: triage, card and discussion
idle_timeout = "15m"          # no stream output this long = stuck
start_stagger = "30s"         # spacing between session starts (+ jitter)
loop_threshold = 10           # identical tool calls within the last 2x this = stuck; 0 disables
required_mcp = []             # MCP servers every session must have connected, e.g. ["claude.ai Slack"]

[sources]                     # what the fallback sweep reads; free-form strings the skill interprets
slack_channels = ["C0000000000"]
tracker = "linear"            # linear | jira | other
tracker_query = "assignee:me state:Todo label:agent"

[intake]
batch_window = "60s"          # collect events this long before one triage session
allow_senders = []            # optional sender allowlist (display names / emails); empty = no filter
                              # mentions of me and direct replies to me always pass
mention_names = []            # your name and handles; flags notifications that mention you

[intake.notifications]        # macOS only; reads the notification database (needs Full Disk Access)
enabled = true
poll = "5s"
apps = ["com.tinyspeck.slackmacgap"]
match = ["#example-channel", "Example Co"]   # substrings of title/subtitle routing a notification
                                             # to this runner; empty = every notification of `apps`

[intake.linear]
enabled = false
api_key_env = "LINEAR_API_KEY"   # personal API key; name of the variable, never the key
poll = "60s"
projects = ["Example App"]       # optional narrowing; assignee = me is always enforced
teams = []
labels = []

[intake.jira]
enabled = false
base_url = "https://example.atlassian.net"
email_env = "JIRA_EMAIL"
token_env = "JIRA_API_TOKEN"
poll = "60s"
jql = "project = EX"             # optional narrowing; runner always ANDs assignee = currentUser()

[[workspaces]]                # where card and discussion work happens; the workflow skill picks by match
name = "example-app"
path = "~/code/example-app"
match = ["EX-", "example-app"]

# Who may be messaged is not configured here: use Claude Code permission rules
# (e.g. deny "mcp__*__send_message") and your outreach.md.
# Secrets (API keys) never go here: see examples/secrets.env.example.
